    <circle cx="58" cy="24" r="1.8"/><circle cx="58" cy="40" r="1.8"/>
    <circle cx="20" cy="4" r="1.8"/><circle cx="44" cy="4" r="1.8"/>
    <circle cx="24" cy="62" r="1.8"/><circle cx="40" cy="62" r="1.8"/>
  </g>
